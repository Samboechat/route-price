name: Android Build

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK debug e release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Keystore de debug compartilhada (opcional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            {
              echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.jks"
              echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
              echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
              echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Keystore de release (opcional)
        id: release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK debug
        run: ./gradlew assembleDebug

      - name: Gerar APK release
        if: steps.release.outputs.signed == 'true'
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: route-price-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.signed == 'true'
        with:
          name: route-price-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Resumo
        run: |
          {
            echo "### APKs"
            echo "- Debug: artifact **route-price-debug-apk** (instalável)"
            if [ "${{ steps.release.outputs.signed }}" = "true" ]; then
              echo "- Release assinada: artifact **route-price-release-apk**"
            else
              echo "- Release: **não gerada** — cadastre os secrets RELEASE_* (docs/GERAR_APK.md)"
            fi
            if [ -z "$MAPS_API_KEY" ]; then
              echo "- Sem MAPS_API_KEY: o APK roda em modo manual (sem mapa/busca de endereços)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
